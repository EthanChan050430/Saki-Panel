services:
  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    environment:
      PANEL_HOST: ${PANEL_HOST:-0.0.0.0}
      PANEL_PORT: ${PANEL_PORT:-5479}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-http://localhost:5479}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5478}
      PANEL_CORS_ORIGINS: ${PANEL_CORS_ORIGINS:-*}
      DATABASE_URL: ${DATABASE_URL:-file:../data/panel/dev.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DISABLE_AUTH: ${DISABLE_AUTH:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DAEMON_REGISTRATION_TOKEN: ${DAEMON_REGISTRATION_TOKEN:?DAEMON_REGISTRATION_TOKEN is required}
      # Keep vertical-pack content out of this image; only the remote registry
      # endpoint and safety limits are passed through at runtime.
      OPERATIONS_PACK_REGISTRY_URL: ${OPERATIONS_PACK_REGISTRY_URL:-}
      OPERATIONS_PACK_REGISTRY_TTL_SECONDS: ${OPERATIONS_PACK_REGISTRY_TTL_SECONDS:-900}
      OPERATIONS_PACK_REQUEST_TIMEOUT_MS: ${OPERATIONS_PACK_REQUEST_TIMEOUT_MS:-20000}
      OPERATIONS_PACK_MAX_REGISTRY_MB: ${OPERATIONS_PACK_MAX_REGISTRY_MB:-2}
      OPERATIONS_PACK_MAX_MANIFEST_MB: ${OPERATIONS_PACK_MAX_MANIFEST_MB:-2}
      OPERATIONS_PACK_MAX_RESOURCE_MB: ${OPERATIONS_PACK_MAX_RESOURCE_MB:-256}
      OPERATIONS_PACK_MAX_RESOURCES: ${OPERATIONS_PACK_MAX_RESOURCES:-100}
    ports:
      - "${PANEL_PORT:-5479}:${PANEL_PORT:-5479}"
    volumes:
      - ./data/panel:/app/data/panel

  daemon:
    build:
      context: .
      dockerfile: apps/daemon/Dockerfile
    environment:
      DAEMON_HOST: ${DAEMON_HOST:-daemon}
      DAEMON_PORT: ${DAEMON_PORT:-5480}
      DAEMON_PROTOCOL: ${DAEMON_PROTOCOL:-http}
      DAEMON_PANEL_URL: ${DAEMON_PANEL_URL:-http://panel:5479}
      DAEMON_REGISTRATION_TOKEN: ${DAEMON_REGISTRATION_TOKEN:?DAEMON_REGISTRATION_TOKEN is required}
      DAEMON_WORKSPACE_ROOT: ${DAEMON_WORKSPACE_ROOT:-/workspace}
    ports:
      - "${DAEMON_PORT:-5480}:${DAEMON_PORT:-5480}"
    volumes:
      - ./data/daemon:/app/data/daemon
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - panel

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5478:80"
    depends_on:
      - panel
