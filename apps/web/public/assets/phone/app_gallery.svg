<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="galleryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="galleryGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="galleryGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#be123c" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#galleryBg)" filter="url(#shadow)" />
  <!-- Radial Aura Glow -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#galleryGlow)" />
  <!-- Gloss overlay -->
  <path d="M 4 34 C 4 17.43 17.43 4 34 4 L 94 4 C 110.57 4 124 17.43 124 34 L 124 56 C 80 44 40 52 4 72 Z" fill="url(#galleryGloss)" />

  <!-- Polaroid Frame and Camera -->
  <g transform="translate(64, 64)">
    <!-- Slanted Polaroid Card behind -->
    <rect x="-30" y="-30" width="46" height="54" rx="4" fill="#f1f5f9" transform="rotate(-12)" stroke="#ffffff" stroke-width="2" />
    <rect x="-26" y="-26" width="38" height="38" rx="2" fill="#38bdf8" transform="rotate(-12)" />

    <!-- Cute Camera in front -->
    <rect x="-28" y="-12" width="56" height="42" rx="10" fill="#ffffff" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.25))" />
    <!-- Top flash bar -->
    <path d="M -12 -12 L -6 -18 L 6 -18 L 12 -12 Z" fill="#ffffff" />
    <circle cx="16" cy="-4" r="3.5" fill="#fbbf24" />

    <!-- Lens Ring -->
    <circle cx="0" cy="9" r="15" fill="#fce7f3" stroke="#f43f5e" stroke-width="3" />
    <circle cx="0" cy="9" r="10" fill="#1e1b4b" />
    <!-- Lens Reflection -->
    <circle cx="-3" cy="6" r="3.5" fill="#ffffff" opacity="0.8" />
    <circle cx="3" cy="12" r="1.5" fill="#ffffff" opacity="0.6" />

    <!-- Cute Heart Emblem -->
    <path d="M 18 20 C 18 17 22 17 22 20 C 22 22 18 25 18 25 C 18 25 14 22 14 20 C 14 17 18 17 18 20 Z" fill="#ec4899" transform="translate(0, 0) scale(1.3)" />

    <!-- Sparkle Stars -->
    <path d="M -24 -24 L -22 -18 L -16 -16 L -22 -14 L -24 -8 L -26 -14 L -32 -16 L -26 -18 Z" fill="#fef08a" />
  </g>
</svg>
