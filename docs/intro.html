<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saki Panel Intro</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b0c10;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
      gap: 20px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    p.sub {
      margin: 0;
      color: #b4b4bb;
      font-size: 14px;
    }
    .player {
      width: min(1120px, 100%);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      border: 1px solid rgba(255,117,172,.28);
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    a.back {
      color: #ff75ac;
      text-decoration: none;
      font-size: 14px;
    }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Saki Panel</h1>
  <p class="sub">Intro · 2560×1440 · with audio</p>
  <div class="player">
    <video
      controls
      playsinline
      preload="metadata"
      poster="intro-poster.jpg"
      src="https://github.com/EthanChan050430/Saki-Panel/releases/download/intro/Saki_Pannel_intro.mp4"
    >
      Your browser does not support video.
    </video>
  </div>
  <a class="back" href="https://github.com/EthanChan050430/Saki-Panel">← Saki Panel on GitHub</a>
</body>
</html>
